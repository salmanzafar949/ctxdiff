# CI + npm auto-publish for the ctxdiff JS/TS SDK (the `js/` package).
#
# Path-filtered to js/** so it ONLY runs when the JS package changes — a
# Python-only push never triggers this, and a JS-only push never triggers the
# PyPI pipeline in publish.yml. That's the "JS → npm, Python → PyPI" split.
#
# What runs when:
#   - pull_request (js/**)      → tests only (the merge gate).
#   - push to main (js/**)      → tests → build → publish to npm, but ONLY when
#                                 BOTH are true: (a) an NPM_TOKEN secret exists,
#                                 and (b) the version in js/package.json is not
#                                 already on npm (the version guard). Otherwise
#                                 it skips publishing and stays green.
#   - workflow_dispatch         → manual re-run of the same pipeline.
#
# One-time setup to turn publishing on (until then it safely no-ops):
#   1. Claim/own `ctxdiff` on npm (the first successful run publishes it).
#   2. Create an npm automation access token and add it as the repo secret
#      NPM_TOKEN (Settings → Secrets and variables → Actions).
#   Releasing = bump `version` in js/package.json and merge to main.
#
# Publishes with --provenance (supply-chain attestation via GitHub OIDC), so the
# publish job needs `id-token: write`. Once the package exists on npm you can
# optionally switch to npm Trusted Publishing (OIDC, tokenless) and drop NPM_TOKEN.

name: JS CI & Publish

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "spec/golden/**"
      - ".github/workflows/js.yml"
  pull_request:
    paths:
      - "js/**"
      - "spec/golden/**"
      - ".github/workflows/js.yml"
  workflow_dispatch:

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The cross-language conformance tests (js/test/conformance.test.ts) skip
      # themselves unless <repo>/venv/bin/python exists — and `venv/` is
      # gitignored, so on a bare runner every parity assertion silently
      # no-op'd and a JS/Python format regression could merge green. Build the
      # venv the tests look for and install the Python SDK into it so those
      # tests actually RUN. `working-directory: .` overrides the job-level
      # `js` default: the venv must live at the REPO ROOT, where the tests
      # resolve it (`resolve(process.cwd(), "..")`).
      - name: Install the Python SDK into ./venv (for cross-language conformance)
        working-directory: .
        run: |
          python -m venv venv
          ./venv/bin/pip install -e .
      # Hard gate, not a nicety. Everything below that compares the two SDKs
      # degrades to a silent no-op without this interpreter, so its absence must
      # end the job here with a message naming the cause — rather than 200 green
      # ticks that quietly checked nothing.
      - name: Assert the conformance venv exists (a missing one must FAIL, not skip)
        working-directory: .
        run: |
          test -x ./venv/bin/python || {
            echo "::error::./venv/bin/python is missing — the cross-language conformance and golden checks cannot run."
            exit 1
          }
          ./venv/bin/python -c "import ctxdiff; print('python ctxdiff', ctxdiff.__version__)"
      - run: npm ci
      - run: npm run build
      # The cross-SDK golden corpus, run FIRST and by itself so its verdict is a
      # named line in the CI log rather than three of four hundred dots. It
      # rebuilds every fixture in spec/golden/corpus/ with THIS SDK's tokenizer
      # and compares against the committed expectations under
      # spec/golden/expected/ — the same files the Python suite compares against.
      # Nothing here can skip: a missing expectation throws, and the pinned
      # gpt-tokenizer version is asserted rather than assumed.
      - name: Golden corpus — JS side must reproduce the committed numbers
        run: npm run test:golden
      # ...and the PYTHON side of the very same goldens, using the venv built
      # above. This is what makes a JS pull request that regenerates the corpus
      # safe to merge: without it, a contributor could rewrite the shared
      # expectations to match a JS-only drift and this workflow would happily
      # agree with itself. Requiring both SDKs to reproduce the committed
      # numbers, in the workflow where the change lands, is the whole point.
      - name: Golden corpus — Python side must reproduce the SAME numbers
        working-directory: .
        run: ./venv/bin/python spec/golden/regenerate.py --check --no-js
      - run: npm test

  publish:
    name: publish to npm (if configured and version is new)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm --provenance attestation
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Guard — need an NPM_TOKEN and a version not yet on npm
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "package version: $v"
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping publish (add it + own the name to enable)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "ctxdiff@$v" version >/dev/null 2>&1; then
            echo "ctxdiff $v already on npm — skipping (bump version in js/package.json to release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "ctxdiff $v not on npm — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + build
        if: steps.guard.outputs.publish == 'true'
        run: |
          npm ci
          npm run build
      - name: Publish to npm (with provenance)
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
