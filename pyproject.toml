[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxdiff"
version = "0.4.0"
description = "git diff for your agent's context window — a context-window debugger for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Salman Zafar" }]
dependencies = ["tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["openai>=1.0", "anthropic>=0.30", "langchain-openai", "langchain-core", "respx>=0.21", "httpx", "google-genai>=1.0", "boto3>=1.34"]

[project.scripts]
ctxdiff = "ctxdiff.cli:main"   # the ctxdiff CLI (diff · tokens · cache · view · export · runs)

[tool.hatch.build.targets.sdist]
# Keep the source tarball lean — no 2.4MB demo GIF, no tests/CI in the pip download.
exclude = ["assets", "tests", ".github", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
