[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxdiff"
version = "0.4.1"
description = "git diff for your agent's context window — a context-window debugger for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Salman Zafar" }]
dependencies = ["tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Storage backends. The core stays dependency-light (tiktoken only) and both
# drivers are imported LAZILY, at connect time, so these extras are optional in
# the real sense: without them ctxdiff still runs, and a store configured for a
# backend whose extra is missing prints an install hint instead of crashing.
postgres = ["psycopg[binary]>=3.1"]
# PyMySQL over mysqlclient: pure Python (no compiler or MySQL client headers at
# install time) and the same `%s` paramstyle as psycopg 3, which is what lets
# both adapters share one set of parameterized statements.
mysql = ["PyMySQL>=1.1"]
eval = ["openai>=1.0", "anthropic>=0.30", "langchain-openai", "langchain-core", "respx>=0.21", "httpx", "google-genai>=1.0", "boto3>=1.34"]

[project.scripts]
ctxdiff = "ctxdiff.cli:main"   # the ctxdiff CLI (diff · tokens · cache · view · export · runs)

[tool.hatch.build.targets.sdist]
# Keep the source tarball lean — no 2.4MB demo GIF, no tests/CI in the pip download.
exclude = ["assets", "tests", ".github", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
